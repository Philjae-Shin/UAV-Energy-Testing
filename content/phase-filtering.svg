<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Use flight phase to focus the review</title>
  <desc id="description">Conceptual examples of phase-aware filtering, without a measured time scale. An energy-vampire candidate and a motor-variance candidate are confined to arming and takeoff, so they are excluded. A drain-rate-spike candidate extends into cruise, so it is retained. The rule keeps a candidate if it overlaps a phase outside arming and takeoff. Separate archived results cover nine simulation logs: six baseline logs and three stress logs. They contain 27 raw candidates, of which 18 are startup-only and excluded, leaving nine retained candidates. These counts come from comparison_table.csv at repository snapshot c8a44f7 and do not establish confirmed software defects.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0F172A; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #475569; }
      .heading { font-size: 34px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; fill: #475569; }
      .detail { font-size: 17px; fill: #475569; }
      .source { font-size: 16px; fill: #475569; }
      .number { font-size: 38px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F8FAFC"/>
  <text x="64" y="57" class="kicker">PHASE-AWARE FILTERING</text>
  <text x="64" y="104" class="heading">Use flight phase to focus the review.</text>
  <text x="64" y="139" class="body">Exclude events confined to arming and takeoff; retain events that extend into later phases.</text>

  <!-- This panel explains interval classification; its widths are not durations. -->
  <rect x="64" y="184" width="1312" height="448" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="96" y="220" class="kicker">CONCEPTUAL INTERVALS</text>
  <text x="1344" y="220" class="detail" text-anchor="end">Illustrative placement; no measured time scale.</text>

  <text x="96" y="286" class="kicker">CANDIDATE</text>
  <text x="1120" y="286" class="kicker">DECISION</text>

  <!-- Flight phases, shown in chronological order. -->
  <rect x="410" y="248" width="200" height="64" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <rect x="634" y="248" width="200" height="64" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="858" y="248" width="200" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="510" y="287" class="label" text-anchor="middle">Arming / takeoff</text>
  <text x="734" y="287" class="label" text-anchor="middle">Cruise</text>
  <text x="958" y="287" class="label" text-anchor="middle">Landing</text>
  <path d="M617 274 L623 280 L617 286 M841 274 L847 280 L841 286" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="410" y="328" width="224" height="256" fill="#FEFCF5"/>
  <rect x="634" y="328" width="224" height="256" fill="#F8FBFF"/>
  <rect x="858" y="328" width="200" height="256" fill="#F8FAFC"/>
  <path d="M634 328 V584 M858 328 V584" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M410 382 H1058 M410 466 H1058 M410 550 H1058" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- A startup-contained interval is excluded. -->
  <text x="96" y="374" class="label">Energy vampire</text>
  <text x="96" y="401" class="detail">Low-activity battery drain</text>
  <rect x="452" y="368" width="112" height="28" rx="6" fill="#D97706"/>
  <rect x="1100" y="350" width="244" height="64" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="1120" y="378" class="label" style="fill:#B45309">Exclude</text>
  <text x="1120" y="401" class="detail">Startup only</text>

  <!-- A second startup-contained interval is excluded by the same rule. -->
  <text x="96" y="458" class="label">Motor variance</text>
  <text x="96" y="485" class="detail">Uneven motor outputs</text>
  <rect x="530" y="452" width="80" height="28" rx="6" fill="#D97706"/>
  <rect x="1100" y="434" width="244" height="64" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="1120" y="462" class="label" style="fill:#B45309">Exclude</text>
  <text x="1120" y="485" class="detail">Startup only</text>

  <!-- This candidate crosses the startup boundary and is retained. -->
  <text x="96" y="542" class="label">Drain-rate spike</text>
  <text x="96" y="569" class="detail">Rapid battery depletion</text>
  <rect x="552" y="536" width="222" height="28" rx="6" fill="#0F766E"/>
  <rect x="1100" y="518" width="244" height="64" rx="10" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="1120" y="546" class="label" style="fill:#0F766E">Retain</text>
  <text x="1120" y="569" class="detail">Overlaps cruise</text>

  <text x="96" y="612" class="body"><tspan font-weight="700" fill="#0F172A">Rule:</tspan> retain a candidate when it overlaps a phase outside arming/takeoff.</text>

  <!-- These numbers are archived observations, separate from the schematic above. -->
  <text x="64" y="675" class="kicker">BUNDLED RESULTS</text>
  <text x="1376" y="675" class="detail" text-anchor="end">Archived simulation analysis</text>

  <rect x="64" y="700" width="304" height="128" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="88" y="749" class="number">9</text>
  <text x="88" y="782" class="label">Mission logs</text>
  <text x="88" y="808" class="detail">6 baseline + 3 stress</text>

  <rect x="400" y="700" width="304" height="128" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="424" y="749" class="number" style="fill:#2563EB">27</text>
  <text x="424" y="782" class="label">Raw candidates</text>
  <text x="424" y="808" class="detail">Across all nine logs</text>

  <rect x="736" y="700" width="304" height="128" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="760" y="749" class="number" style="fill:#B45309">18</text>
  <text x="760" y="782" class="label">Startup-only excluded</text>
  <text x="760" y="808" class="detail">Confined to arming/takeoff</text>

  <rect x="1072" y="700" width="304" height="128" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="1096" y="749" class="number" style="fill:#0F766E">9</text>
  <text x="1096" y="782" class="label">Retained candidates</text>
  <text x="1096" y="808" class="detail">Overlap later flight phases</text>

  <text x="64" y="872" class="source">Source: src/results/phase_aware/comparison_table.csv · snapshot c8a44f7</text>
  <text x="1376" y="872" class="source" text-anchor="end">Counts describe detector candidates.</text>
</svg>
