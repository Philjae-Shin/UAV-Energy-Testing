<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
  <title id="title">UAV energy analysis: from PX4 flight logs to candidate intervals and phase-aware reports</title>
  <desc id="desc">Existing PX4 and Aerialist simulation tools produce ULog files containing battery, motor, and position telemetry. The project's EnergyMonitor extracts and prepares this data. Four rule-based detectors identify energy vampire, voltage anomaly, motor inefficiency, and drain rate spike candidates; motor variance uses the four individual PWM channels. Raw candidate intervals include type, severity, timing, and metrics and feed JSON reports and plots. A separate phase-aware workflow combines altitude-based flight phases with raw candidate intervals, removes candidates confined to startup, and produces retained candidates and phase results. Default log replay exports raw analysis; phase filtering is a separate workflow.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0F172A; }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .heading { font-size: 34px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; fill: #475569; }
      .detail { font-size: 16px; fill: #475569; }
      .detector { font-size: 22px; fill: #0F172A; }
      .blue { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .teal { fill: none; stroke: #0F766E; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1440" height="1010" fill="#F8FAFC"/>
  <text x="64" y="57" class="kicker">UAV ENERGY ANALYSIS</text>
  <text x="64" y="104" class="heading">From flight logs to energy-anomaly evidence.</text>
  <text x="64" y="139" class="body">Rule-based detection with flight-phase context and traceable reports.</text>

  <!-- Existing simulation tools supply logs to the project's analysis layer. -->
  <rect x="64" y="196" width="240" height="112" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="88" y="225" class="kicker">UPSTREAM</text>
  <text x="88" y="259" class="label">PX4 / Aerialist</text>
  <text x="88" y="288" class="body">Flight simulation</text>
  <path d="M184 308 V378" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <rect x="64" y="380" width="240" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="88" y="420" class="label">ULog (.ulg)</text>
  <text x="88" y="454" class="body">Battery · motors</text>
  <text x="88" y="482" class="body">Position telemetry</text>

  <!-- The ownership boundary includes detection, exports, and phase analysis. -->
  <rect x="368" y="196" width="1008" height="748" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M388 196 H1356" stroke="#2563EB" stroke-width="4"/>
  <text x="392" y="239" class="label">Project analysis layer</text>
  <text x="392" y="271" class="body">Telemetry preparation · configurable rules · interval-level evidence</text>
  <line x1="392" y1="290" x2="1352" y2="290" stroke="#E2E8F0"/>

  <path d="M304 450 H390" class="blue" marker-end="url(#arrow-blue)"/>
  <path d="M656 450 H722" class="blue" marker-end="url(#arrow-blue)"/>
  <path d="M1028 450 H1086" class="blue" marker-end="url(#arrow-blue)"/>

  <rect x="392" y="322" width="264" height="226" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="416" y="365" class="label">EnergyMonitor</text>
  <text x="416" y="404" class="body">Extract + prepare</text>
  <text x="416" y="440" class="body">Battery + altitude</text>
  <text x="416" y="470" class="body">Motor PWM channels</text>
  <text x="416" y="520" class="detail">Profiles + motor channels</text>

  <rect x="724" y="322" width="304" height="226" rx="12" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="748" y="365" class="label">Four detectors</text>
  <text x="748" y="404" class="detector">Energy Vampire</text>
  <text x="748" y="434" class="detector">Voltage Anomaly</text>
  <text x="748" y="464" class="detector">Motor Inefficiency</text>
  <text x="748" y="494" class="detector">Drain Rate Spike</text>
  <text x="748" y="526" class="detail">Variance: four PWM channels</text>

  <rect x="1088" y="322" width="264" height="226" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="1112" y="365" class="label">Raw candidates</text>
  <text x="1112" y="408" class="body">Time intervals</text>
  <text x="1112" y="440" class="body">Type + severity</text>
  <text x="1112" y="472" class="body">Detector metrics</text>
  <text x="1112" y="520" class="detail">Default replay output</text>

  <!-- Default replay exports raw detections. -->
  <path d="M1220 548 V582" class="blue" marker-end="url(#arrow-blue)"/>
  <rect x="1088" y="584" width="264" height="96" rx="12" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="1112" y="623" class="label">Reports + plots</text>
  <text x="1112" y="655" class="detail">JSON · profiles · timelines</text>

  <!-- Separate phase analysis consumes both altitude and candidate intervals. -->
  <path d="M524 548 V752" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="540" y="633" class="detail">Altitude</text>
  <text x="540" y="657" class="detail">profile</text>
  <path d="M1088 516 H1056 V714 H876 V752" class="teal" marker-end="url(#arrow-teal)"/>
  <text x="952" y="702" text-anchor="middle" class="detail">Candidate intervals</text>
  <path d="M656 820 H722" class="teal" marker-end="url(#arrow-teal)"/>
  <path d="M1028 820 H1086" class="teal" marker-end="url(#arrow-teal)"/>

  <rect x="392" y="754" width="264" height="132" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="416" y="795" class="label">Phase classifier</text>
  <text x="416" y="831" class="body">Arming / takeoff</text>
  <text x="416" y="861" class="body">Cruise · landing</text>

  <rect x="724" y="754" width="304" height="132" rx="12" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="748" y="795" class="label">Phase overlap filter</text>
  <text x="748" y="831" class="body">Remove startup-only</text>
  <text x="748" y="861" class="body">candidate intervals</text>

  <rect x="1088" y="754" width="264" height="132" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="1112" y="791" class="label">Retained</text>
  <text x="1112" y="821" class="label">candidates</text>
  <text x="1112" y="861" class="body">+ phase results</text>

  <line x1="392" y1="915" x2="423" y2="915" stroke="#0F766E" stroke-width="3"/>
  <text x="435" y="921" class="detail">Separate phase-aware workflow</text>
  <text x="64" y="980" class="detail">PX4 telemetry · explainable detection rules · flight-phase interpretation</text>
  <text x="1376" y="980" text-anchor="end" class="detail">01 / ARCHITECTURE</text>
</svg>
